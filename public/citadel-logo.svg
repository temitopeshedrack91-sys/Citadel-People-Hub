<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 136" fill="none" width="100%" height="100%">
  <!-- The Citadel Global Community Church Official Logo Vector -->
  <g id="citadel-emblem" transform="translate(0, 0)">
    <!-- Outer Gold Frame with diagonal cutout on right and bottom -->
    <path 
      d="M 0,0 L 136,0 L 136,71.5 L 123,63 L 123,13 L 13,13 L 13,123 L 60,123 L 60,136 L 0,136 Z" 
      fill="#D4AF37" 
    />
    
    <!-- Gold 5-pointed Star in top-left quadrant -->
    <polygon 
      points="37.5,23.5 41.5,33.5 51.5,34.5 43,39.5 46.5,50.5 37.5,43.5 28.5,50.5 32,39.5 23.5,34.5 33.5,33.5" 
      fill="#D4AF37" 
    />

    <!-- Shorter Tower (Left, width 26, roof slopes upward from 88 to 78) -->
    <polygon points="69,136 69,88 95,78 95,136" fill="currentColor" />

    <!-- Taller Tower (Right, width 33, peak at 61, roof slopes downward to 83) -->
    <polygon points="103,136 103,61 136,83 136,136" fill="currentColor" />
  </g>

  <!-- Wordmark: THE CITADEL / GLOBAL COMMUNITY / CHURCH -->
  <g id="citadel-wordmark" fill="currentColor" font-family="'Plus Jakarta Sans', 'Cinzel', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900">
    <text x="160" y="46" font-size="38" letter-spacing="0.5" font-weight="900">THE CITADEL</text>
    <text x="160" y="88" font-size="34" letter-spacing="0.2" font-weight="900">GLOBAL COMMUNITY</text>
    <text x="160" y="126" font-size="34" letter-spacing="1.2" font-weight="900">CHURCH</text>
  </g>
</svg>
